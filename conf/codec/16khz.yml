# HP-codec, phase 1/3: train the 16 kHz branch alone.
#
# Both branches use encoder rates whose products give the same token rate, so
# a 16 kHz token and a 48 kHz token cover the same temporal context. This is
# what lets HP-codecX map one onto the other position by position.
#
# Edit the dataset paths at the bottom of this file before training.

# Model setup
DAC.sample_rates: [16000, 48000]
DAC.encoder_dims: [64, 64]
DAC.encoder_rates: [[2, 2, 5, 8], [2, 5, 6, 8]]
DAC.decoder_dim: [1536, 1536]
DAC.decoder_rates: [[8, 5, 2, 2], [8, 6, 5, 2]]
DAC.final_sum: True

# Quantization: three codebooks in the harmonic section and three in the
# percussive section, per branch. 6 kbit/s at 16 kHz, 12 kbit/s at 48 kHz.
DAC.n_codebooks: [3, 3]
DAC.codebooks_comp: [3, 3]
DAC.codebook_size: 1024
DAC.codebook_dim: 8
DAC.quantizer_dropout: 1.0

# Discriminator
Discriminator.sample_rates: [16000, 48000]
Discriminator.rates: []
Discriminator.periods: [2, 3, 5, 7, 11]
Discriminator.fft_sizes: [2048, 1024, 512]
Discriminator.bands:
  - [0.0, 0.1]
  - [0.1, 0.25]
  - [0.25, 0.5]
  - [0.5, 0.75]
  - [0.75, 1.0]

# Optimization
AdamW.betas: [0.8, 0.99]
AdamW.lr: 0.0001
ExponentialLR.gamma: 0.999996

amp: false
device: cuda
num_iters: 35000
save_iters: [10000, 50000, 100000, 200000]
valid_freq: 1000
sample_freq: 1000
val_idx: [0, 1, 2, 3, 4, 5, 6, 7]
training_sr: 16000
lambdas:
  mel/loss: 15.0
  adv/feat_loss: 2.0
  adv/gen_loss: 1.0
  vq/commitment_loss: 0.25
  vq/codebook_loss: 1.0

VolumeNorm.db: [const, -16]

# Transforms
build_transform.preprocess:
  - Identity
build_transform.augment_prob: 0.0
build_transform.augment:
  - Identity
build_transform.postprocess:
  - VolumeNorm
  - RescaleAudio
  - ShiftPhase

# Loss setup
MultiScaleSTFTLoss.window_lengths: [2048, 512]
MelSpectrogramLoss.n_mels: [5, 10, 20, 40, 80, 160, 320]
MelSpectrogramLoss.window_lengths: [32, 64, 128, 256, 512, 1024, 2048]
MelSpectrogramLoss.mel_fmin: [0, 0, 0, 0, 0, 0, 0]
MelSpectrogramLoss.mel_fmax: [null, null, null, null, null, null, null]
MelSpectrogramLoss.pow: 1.0
MelSpectrogramLoss.clamp_eps: 1.0e-5
MelSpectrogramLoss.mag_weight: 0.0

# Data
batch_size: 32
val_batch_size: 8
num_workers: 8

train/AudioDataset.duration: 0.38
train/AudioDataset.n_examples: 10000000

val/AudioDataset.duration: 5.0
val/build_transform.augment_prob: 1.0
val/AudioDataset.n_examples: 250

test/AudioDataset.duration: 10.0
test/build_transform.augment_prob: 1.0
test/AudioDataset.n_examples: 1000

AudioLoader.shuffle: true
AudioDataset.without_replacement: true

# EDIT ME: point these at your own copies of MUSDB18 and MTG-Jamendo.
train/build_dataset.folders:
  music_hq:
    - /path/to/MUSDB18/train/Mixtures
    - /path/to/mtg-jamendo-dataset/audio

val/build_dataset.folders:
  music_hq:
    - /path/to/MUSDB18/test/Mixtures

test/build_dataset.folders:
  music_hq:
    - /path/to/MUSDB18/test/Mixtures
